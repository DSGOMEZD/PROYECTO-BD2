<div class="auth-page">
  <form class="card" (ngSubmit)="registrar()">
    <h1 class="logo">Moto<strong>Go</strong></h1>
    <p class="subtitle">Crea tu cuenta</p>

    <p class="field-label">¿Qué quieres hacer?</p>
    <div class="rol-selector">
      <button type="button" class="rol-option"
              [class.active]="datos.rol === Rol.ARRENDATARIO"
              (click)="datos.rol = Rol.ARRENDATARIO">
        <strong>Arrendatario</strong>
        <span>Quiero alquilar una moto</span>
      </button>
      <button type="button" class="rol-option"
              [class.active]="datos.rol === Rol.ARRENDADOR"
              (click)="datos.rol = Rol.ARRENDADOR">
        <strong>Arrendador</strong>
        <span>Quiero poner mi moto en alquiler</span>
      </button>
    </div>

    <div class="row">
      <label class="field field-tipo-doc">
        Tipo
        <select name="tipoDocumento" [(ngModel)]="datos.tipoDocumento">
          @for (t of tiposDocumento; track t.valor) {
            <option [value]="t.valor">{{ t.valor }}</option>
          }
        </select>
      </label>
      <label class="field">
        Número de documento
        <input type="number" name="numeroDocumento" [(ngModel)]="datos.numeroDocumento" />
      </label>
    </div>

    <div class="row">
      <label class="field">
        Nombre
        <input type="text" name="nombre" [(ngModel)]="datos.nombre" />
      </label>
      <label class="field">
        Apellido
        <input type="text" name="apellido" [(ngModel)]="datos.apellido" />
      </label>
    </div>

    <label class="field">
      Correo
      <input type="email" name="correo" [(ngModel)]="datos.correo" placeholder="tucorreo@ejemplo.com" />
    </label>

    <label class="field">
      Teléfono
      <input type="tel" name="telefono" [(ngModel)]="datos.telefono" />
    </label>

    <label class="field">
      Contraseña
      <input type="password" name="contrasena" [(ngModel)]="datos.contrasena" />
    </label>

    <button type="submit" class="btn btn-primary">Registrarme</button>

    <p class="switch">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</div>
