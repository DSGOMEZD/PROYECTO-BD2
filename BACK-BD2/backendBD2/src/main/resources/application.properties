spring.application.name=backendBD2
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/motogo?serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password


# MongoDB: base donde se guardan los logs de actividad (patron bucket)
spring.mongodb.uri=mongodb://localhost:27017/motogo_logs?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000
# Maximo de eventos por cubeta; al llenarse se abre una nueva para el mismo modulo y dia
app.logs.eventos-por-bucket=50

# Administrador inicial: se crea al arrancar si no existe ningun usuario con rol ADMIN
app.admin.documento=1
app.admin.correo=admin@motogo.com
app.admin.contrasena=Admin123*
