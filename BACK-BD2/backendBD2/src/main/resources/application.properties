spring.application.name=backendBD2
server.port=8080

# 1. MYSQL (MV1 - Base de Datos Relacional: 127.0.0.1 en Host local | 100.70.144.4 en Tailscale)
spring.datasource.url=jdbc:mysql://${DB_MYSQL_HOST:127.0.0.1}:3306/alquiler_motos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_MYSQL_USER:motogo_admin}
spring.datasource.password=${DB_MYSQL_PASS:1234}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# 2. MONGODB 7.0 CON AUTENTICACION (MV2 - Contenedor motogo-mongo: 127.0.0.1 en Host local | 100.70.143.38 en Tailscale)
spring.mongodb.uri=mongodb://${DB_MONGO_USER:motogo_logger}:${DB_MONGO_PASS:MotoLog2026*}@${DB_MONGO_HOST:127.0.0.1}:27017/alquiler_motos_logs?authSource=admin&connectTimeoutMS=10000&serverSelectionTimeoutMS=10000
spring.mongodb.database=alquiler_motos_logs
spring.data.mongodb.uri=mongodb://${DB_MONGO_USER:motogo_logger}:${DB_MONGO_PASS:MotoLog2026*}@${DB_MONGO_HOST:127.0.0.1}:27017/alquiler_motos_logs?authSource=admin&connectTimeoutMS=10000&serverSelectionTimeoutMS=10000
spring.data.mongodb.database=alquiler_motos_logs

# 3. CONFIGURACION LOGS
app.logs.eventos-por-bucket=50

# 4. ADMINISTRADOR INICIAL
app.admin.documento=1
app.admin.correo=admin@motogo.com
app.admin.contrasena=${APP_ADMIN_PASS:Admin123*}
